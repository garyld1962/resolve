name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Drizzle migration drift check
        env:
          POSTGRES_URL_NON_POOLING: postgres://stub:stub@localhost:5432/stub
        run: |
          pnpm db:generate
          if ! git diff --exit-code drizzle/; then
            echo "::error::Drizzle schema drift — run pnpm db:generate and commit the new migration."
            exit 1
          fi
